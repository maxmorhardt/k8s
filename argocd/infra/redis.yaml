apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  sources:
    - repoURL: https://valkey.io/valkey-helm/
      chart: valkey
      # renovate: datasource=helm depName=valkey registryUrl=https://valkey.io/valkey-helm/
      targetRevision: 0.12.0
      helm:
        valueFiles:
          - $values/redis/values.yaml
    - repoURL: https://github.com/maxmorhardt/infra.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
