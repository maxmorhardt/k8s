name: k8s CI

on:
  pull_request:
    branches: [main]

jobs:
  validate-charts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: grafana/alloy
            # renovate: datasource=helm depName=alloy registryUrl=https://grafana.github.io/helm-charts
            chart_version: '1.12.1'
            helm_repo_name: grafana
            helm_repo_url: https://grafana.github.io/helm-charts
            values_file: alloy/values.yaml
          - chart: argo/argo-cd
            # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
            chart_version: '10.6.4'
            helm_repo_name: argo
            helm_repo_url: https://argoproj.github.io/argo-helm
            values_file: argocd/values.yaml
          - chart: dex/dex
            # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
            chart_version: '0.24.1'
            helm_repo_name: dex
            helm_repo_url: https://charts.dexidp.io
            values_file: dex/values.yaml
          - chart: oci://docker.io/envoyproxy/gateway-helm
            # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-helm
            chart_version: '1.9.1'
            values_file: envoy-gateway/values.yaml
          - chart: kubereboot/kured
            # renovate: datasource=helm depName=kured registryUrl=https://kubereboot.github.io/charts
            chart_version: '6.1.0'
            helm_repo_name: kubereboot
            helm_repo_url: https://kubereboot.github.io/charts
            values_file: kured/values.yaml
          - chart: grafana/loki
            # renovate: datasource=helm depName=loki registryUrl=https://grafana.github.io/helm-charts
            chart_version: '7.3.0'
            helm_repo_name: grafana
            helm_repo_url: https://grafana.github.io/helm-charts
            values_file: loki/values.yaml
          - chart: nats/nats
            # renovate: datasource=helm depName=nats registryUrl=https://nats-io.github.io/k8s/helm/charts/
            chart_version: '2.14.6'
            helm_repo_name: nats
            helm_repo_url: https://nats-io.github.io/k8s/helm/charts/
            values_file: nats/values.yaml
          - chart: cnpg/cloudnative-pg
            # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.github.io/charts
            chart_version: '0.29.0'
            helm_repo_name: cnpg
            helm_repo_url: https://cloudnative-pg.github.io/charts
            values_file: postgres/values-operator.yaml
          - chart: cnpg/cluster
            # renovate: datasource=helm depName=cluster registryUrl=https://cloudnative-pg.github.io/charts
            chart_version: '0.8.1'
            helm_repo_name: cnpg
            helm_repo_url: https://cloudnative-pg.github.io/charts
            values_file: postgres/values-cluster.yaml
          - chart: prometheus-community/kube-prometheus-stack
            # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
            chart_version: '88.6.2'
            helm_repo_name: prometheus-community
            helm_repo_url: https://prometheus-community.github.io/helm-charts
            values_file: prometheus-stack/values.yaml
          - chart: sealed-secrets/sealed-secrets
            # renovate: datasource=helm depName=sealed-secrets registryUrl=https://bitnami.github.io/sealed-secrets
            chart_version: '2.19.3'
            helm_repo_name: sealed-secrets
            helm_repo_url: https://bitnami.github.io/sealed-secrets
            values_file: sealed-secrets/values.yaml
    uses: maxmorhardt/workflows/.github/workflows/validate-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart: ${{ matrix.chart }}
      chart_version: ${{ matrix.chart_version }}
      helm_repo_name: ${{ matrix.helm_repo_name }}
      helm_repo_url: ${{ matrix.helm_repo_url }}
      values_file: ${{ matrix.values_file }}
      lint: false
      kubeconform: false

  validate-manifests:
    uses: maxmorhardt/workflows/.github/workflows/validate-manifests.yml@main
    with:
      repository: ${{ github.repository }}
      manifests: |
        argocd/root.yaml
        argocd/infra
        argocd/apps
        system-upgrade-controller/plans.yaml
        storage/local-path-retain.yaml

  validate-terraform:
    strategy:
      fail-fast: false
      matrix:
        module: [aws, cloudflare, github]
    uses: maxmorhardt/workflows/.github/workflows/validate-terraform.yml@main
    with:
      repository: ${{ github.repository }}
      working_directory: terraform/${{ matrix.module }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      cloudflare_api_token: ${{ matrix.module == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      repo_admin_token: ${{ matrix.module == 'github' && secrets.REPO_ADMIN_TOKEN || '' }}
      tf_vars: ${{ matrix.module == 'cloudflare' && secrets.TF_VARS || '' }}

  validate-complete:
    name: Validate Complete
    if: always()
    needs: [validate-charts, validate-manifests, validate-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all validations succeeded
        env:
          CHARTS: ${{ needs.validate-charts.result }}
          MANIFESTS: ${{ needs.validate-manifests.result }}
          TERRAFORM: ${{ needs.validate-terraform.result }}
        run: |
          echo "validate-charts=$CHARTS validate-manifests=$MANIFESTS validate-terraform=$TERRAFORM"
          if [ "$CHARTS" != "success" ] || [ "$MANIFESTS" != "success" ] || [ "$TERRAFORM" != "success" ]; then
            echo "a required validation did not succeed"
            exit 1
          fi
