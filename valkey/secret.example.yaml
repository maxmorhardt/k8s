apiVersion: v1
kind: Secret
metadata:
  name: valkey-users
  namespace: valkey
type: Opaque
stringData:
  # replication, sentinel, valkey-cli, and the metrics exporter
  default: "CHANGE-ME"
  # the squares services; REDIS_URL in each squares-<service>-env is redis://squares:<this>@valkey-master.valkey.svc:6379/0; its sha256 is in values.yaml
  squares: "CHANGE-ME"
