apiVersion: v1
kind: Secret
metadata:
  name: valkey-users
  namespace: valkey
type: Opaque
stringData:
  # admin user, for valkey-cli and the metrics exporter
  default: "CHANGE-ME"
  # the squares services; REDIS_URL in each squares-<service>-env is redis://squares:<this>@valkey.valkey.svc:6379/0
  squares: "CHANGE-ME"
