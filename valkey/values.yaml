fullnameOverride: valkey

deploymentStrategy: Recreate

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi

valkeyConfig: |
  maxmemory 384mb
  maxmemory-policy volatile-ttl
  appendonly yes
  appendfsync always

dataStorage:
  enabled: true
  requestedSize: 2Gi
  className: local-path-retain
  keepPvc: true

auth:
  enabled: true
  usersExistingSecret: valkey-users
  aclUsers:
    default:
      permissions: "~* &* +@all"
    squares:
      permissions: "~squares:* resetchannels +@all -@dangerous"

readinessProbe:
  enabled: true

metrics:
  enabled: true
  exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  serviceMonitor:
    enabled: true
