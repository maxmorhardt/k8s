apiVersion: v1
kind: Secret
metadata:
  name: redis-users
  namespace: redis
type: Opaque
stringData:
  # admin user, for redis-cli and the metrics exporter
  default: "CHANGE-ME"
  # the squares services; REDIS_URL in squares-api-env is redis://squares:<this>@redis.redis.svc:6379/0
  squares: "CHANGE-ME"
